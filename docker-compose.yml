services:

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # talk to the qdrant container, not localhost
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
      - backend_cache:/app/cache
      - backend_db:/app/db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  backend_uploads:
  backend_exports:
  backend_cache:
  backend_db:
